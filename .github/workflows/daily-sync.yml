name: Daily standings & fixtures sync
on: { schedule: [ { cron: "0 6 * * *" } ], workflow_dispatch: {} }
permissions: { id-token: write, contents: read }
jobs: { sync: { runs-on: ubuntu-latest, steps: [ { uses: "actions/checkout@v4" }, { uses: "actions/setup-node@v4", with: { node-version: "20" } }, { run: "npm install" }, { id: "auth", uses: "google-github-actions/auth@v2", with: { project_id: "prediction-light", workload_identity_provider: "projects/278522340951/locations/global/workloadIdentityPools/github-pool/providers/github-provider", service_account: "prediction-light-sync@prediction-light.iam.gserviceaccount.com" } }, { name: "Run daily sync", env: { API_FOOTBALL_KEY: "${{ secrets.API_FOOTBALL_KEY }}" }, run: "npm run daily" } ] } }